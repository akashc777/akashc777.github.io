---
layout: default
title: "Search"
description: "Search every post on Akash Hadagali's blog."
---
<div class="wrap">
  <header class="page-head">
    <p class="eyebrow">Search</p>
    <h1>Find a post</h1>
    <form class="search-form" action="{{ '/search' | relative_url }}" role="search">
      <label class="visually-hidden" for="search-box">Search posts</label>
      <input class="input" id="search-box" name="query" type="search" placeholder="Try Go, Dgraph or agents" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <p class="search-status" id="search-status" aria-live="polite">Every post is searchable, title to last line.</p>
  </header>
  <ul id="search-results" class="post-list"></ul>
</div>
<script src="{{ '/assets/js/search.js' | relative_url }}" data-index="{{ '/search.json' | relative_url }}" defer></script>
