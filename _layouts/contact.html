---
layout: default
---
<div class="wrap">
  <header class="page-head">
    <p class="eyebrow">Say hello</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="contact-grid">
    <form method="POST" action="{{ site.data.parameters.contact_form_action }}" class="form-grid">
      <div class="field"><label for="name">Name</label><input class="input" type="text" name="name" id="name" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input class="input" type="email" name="email" id="email" autocomplete="email" required></div>
      <div class="field full"><label for="subject">Subject</label><input class="input" type="text" name="subject" id="subject"></div>
      <div class="field full"><label for="message">Message</label><textarea class="input" name="message" id="message" rows="6" required></textarea></div>
      <div class="full"><button class="btn btn-primary" type="submit">Send message</button></div>
    </form>
    <aside class="contact-aside">
      <h2>Other ways in</h2>
      <div class="content">{{ content }}</div>
      <ul>
        {%- for social in site.data.parameters.social %}
        <li><a href="{{ social.link }}" rel="me noopener">{{ social.name }}</a></li>
        {%- endfor %}
      </ul>
    </aside>
  </div>
</div>
