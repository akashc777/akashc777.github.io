# How tags look and which ones the home page offers.
#
# The six markers are lemon, pink, mint, tangerine, violet and cyan (their
# colours live in assets/css/site.css). A tag listed under `hues` always wears
# that marker. Any other tag gets one from `fallback`, picked by the length of
# its name, so a new tag is at least the same colour on every page.

# On nearly every post, so a list row that showed them would say nothing.
# They still show on the post itself.
