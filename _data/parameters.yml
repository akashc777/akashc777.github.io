########################### Navigation ###################################
# `match` lists the URL prefixes that mark a menu item as the current page.
menu:
  main:
  - {name: Blog, url: '/blog', match: ['/blog', '/post/', '/tag']}
  - {name: Projects, url: '/projects', match: ['/projects']}
  - {name: About, url: '/about/akash-hadagali', match: ['/about/']}
  - {name: Contact, url: '/contact', match: ['/contact']}

  # Footer columns; a third, "Elsewhere", is built from `social` below.
  footer:
  - title: Read
    links:
    - {name: All posts, url: '/blog'}
    - {name: Tags, url: '/tags'}
    - {name: Search, url: '/search'}
    - {name: RSS feed, url: '/feed.xml'}
  - title: About
    links:
    - {name: About me, url: '/about/akash-hadagali'}
    - {name: Projects, url: '/projects'}
    - {name: Contact, url: '/contact'}

